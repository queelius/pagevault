  <style data-pagevault-runtime>
/* pagevault wrap styles */
:root {
  --pv-color-primary: #4CAF50;
  --pv-color-secondary: #76B852;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

pagevault {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

pagevault[data-decrypted] {
  display: block;
  min-height: auto;
}

.pagevault-container {
  text-align: center;
  padding: 2rem;
  border: 2px dashed #ccc;
  border-radius: 8px;
  background: #f9f9f9;
  max-width: 400px;
  margin: 2rem auto;
}

.pagevault-icon { font-size: 3rem; margin-bottom: 1rem; }
.pagevault-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: #333; }
.pagevault-hint { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
.pagevault-filename { color: #999; font-size: 0.8rem; margin-bottom: 1rem; font-family: monospace; }

.pagevault-form {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.pagevault-input {
  padding: 0.75rem 1rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.pagevault-input:focus { border-color: #4CAF50; }

.pagevault-button {
  padding: 0.75rem 1rem;
  background: linear-gradient(135deg, #4CAF50, #76B852);
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.2s;
}
.pagevault-button:hover { opacity: 0.9; }
.pagevault-button:disabled { opacity: 0.5; cursor: not-allowed; }
.pagevault-error { color: #dc3545; font-size: 0.9rem; margin-top: 0.5rem; }

/* Toolbar */
.pagevault-toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 1rem;
  background: #f8f8f8;
  border-bottom: 1px solid #ddd;
  font-size: 0.85rem;
}
.toolbar-filename {
  font-family: 'Consolas', 'Monaco', monospace;
  font-weight: 600;
  color: #333;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.toolbar-size { color: #888; white-space: nowrap; }
.toolbar-btn {
  margin-left: auto;
  padding: 0.3rem 0.75rem;
  background: #4CAF50;
  color: white;
  text-decoration: none;
  border: none;
  border-radius: 3px;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
}
.toolbar-btn:hover { opacity: 0.85; }
.toolbar-btn.active { background: #555; }
.toolbar-toggle { margin-left: 0; }

/* Viewer base */
.pagevault-viewer { width: 100%; }
.pagevault-viewer iframe { width: 100%; height: calc(100vh - 40px); border: none; }
.pagevault-viewer pre {
  margin: 0;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 0.9rem;
  line-height: 1.6;
}

/* Download view */
.pagevault-download {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  gap: 1rem;
}
.pagevault-download a {
  display: inline-block;
  padding: 1rem 2rem;
  background: #4CAF50;
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-size: 1.1rem;
}
.pagevault-download a:hover { opacity: 0.9; }
.pagevault-download .file-info { color: #666; font-size: 0.9rem; }

/* Site viewer */
.pagevault-site-frame { width: 100%; height: 100vh; border: none; }

/* Dark mode */
@media (prefers-color-scheme: dark) {
  body { background: #1a1a2a; color: #e0e0e0; }
  .pagevault-container { background: #1e1e2e; border-color: #444; }
  .pagevault-title { color: #e0e0e0; }
  .pagevault-hint { color: #999; }
  .pagevault-filename { color: #777; }
  .pagevault-input { background: #2a2a3a; border-color: #555; color: #e0e0e0; }
  .pagevault-toolbar { background: #252535; border-bottom-color: #444; }
  .toolbar-filename { color: #e0e0e0; }
  .toolbar-size { color: #999; }
  .pagevault-download .file-info { color: #999; }
}

/* Audio viewer */
.pagevault-audio-viewer {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 200px;
  padding: 2rem;
  background: #f5f5f5;
}
.pagevault-audio-viewer audio {
  width: 100%;
  max-width: 600px;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .pagevault-audio-viewer { background: #1a1a2a; }
}

/* Image viewer */
.pagevault-image-viewer {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: calc(100vh - 40px);
  background: #f0f0f0;
  padding: 1rem;
  overflow: auto;
}
.pagevault-image-viewer img {
  max-width: 100%;
  max-height: calc(100vh - 72px);
  height: auto;
  display: block;
  cursor: zoom-in;
  object-fit: contain;
}
.pagevault-image-viewer img.zoomed {
  max-width: none;
  max-height: none;
  cursor: zoom-out;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .pagevault-image-viewer { background: #1a1a2a; }
}

/* Markdown rendered view */
.markdown-body {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem;
  line-height: 1.7;
  color: #24292e;
}
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  margin-top: 1.5em;
  margin-bottom: 0.5em;
  font-weight: 600;
  line-height: 1.25;
}
.markdown-body h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid #eee; }
.markdown-body h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid #eee; }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body a { color: var(--pv-color-primary); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
.markdown-body th, .markdown-body td { border: 1px solid #ddd; padding: 0.5em 0.75em; text-align: left; }
.markdown-body th { background: #f6f8fa; font-weight: 600; }
.markdown-body code {
  padding: 0.2em 0.4em;
  background: #f0f0f0;
  border-radius: 3px;
  font-size: 0.85em;
  font-family: 'Consolas', 'Monaco', monospace;
}
.markdown-body pre {
  padding: 1em;
  background: #f6f8fa;
  border-radius: 4px;
  overflow-x: auto;
}
.markdown-body pre code { padding: 0; background: none; font-size: 0.9em; }
.markdown-body blockquote {
  margin: 1em 0;
  padding: 0.5em 1em;
  border-left: 4px solid #ddd;
  color: #666;
}
.markdown-body hr { border: none; border-top: 1px solid #ddd; margin: 1.5em 0; }
.markdown-body ul, .markdown-body ol { padding-left: 2em; margin: 0.5em 0; }
.markdown-body li { margin: 0.25em 0; }
.markdown-body img { max-width: 100%; height: auto; }
.markdown-body p { margin: 0.75em 0; }

/* Markdown source toggle */
.markdown-source { max-width: 800px; margin: 0 auto; padding: 0; }
.markdown-source pre {
  padding: 2rem;
  background: #f5f5f5;
  min-height: calc(100vh - 40px);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .markdown-body { color: #e0e0e0; }
  .markdown-body h1, .markdown-body h2 { border-bottom-color: #444; }
  .markdown-body th, .markdown-body td { border-color: #444; }
  .markdown-body th { background: #2a2a3a; }
  .markdown-body code { background: #2a2a3a; }
  .markdown-body pre { background: #2a2a3a; }
  .markdown-body blockquote { border-left-color: #555; color: #999; }
  .markdown-body hr { border-top-color: #444; }
  .markdown-source pre { background: #1a1a2a; color: #e0e0e0; }
}

/* Text viewer with line numbers */
.pagevault-text-viewer {
  display: flex;
  min-height: calc(100vh - 40px);
  background: #f5f5f5;
}
.pagevault-text-viewer .line-numbers {
  padding: 1rem 0.75rem 1rem 1rem;
  text-align: right;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 0.9rem;
  line-height: 1.6;
  color: #999;
  user-select: none;
  -webkit-user-select: none;
  border-right: 1px solid #ddd;
  background: #eee;
}
.pagevault-text-viewer pre {
  flex: 1;
  padding: 1rem;
  overflow-x: auto;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .pagevault-text-viewer { background: #1a1a2a; color: #e0e0e0; }
  .pagevault-text-viewer .line-numbers { background: #252535; border-right-color: #444; color: #666; }
}

/* Video viewer */
.pagevault-video-viewer {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: calc(100vh - 40px);
  background: #000;
  padding: 0;
}
.pagevault-video-viewer video {
  max-width: 100%;
  max-height: calc(100vh - 40px);
}
/* pagevault progress bar */
.pagevault-progress {
  width: 100%;
  background: #e2e8f0;
  border-radius: 8px;
  overflow: hidden;
  margin: 1rem 0;
  height: 24px;
}
.pagevault-progress-bar {
  height: 100%;
  background: var(--pv-color-primary, #4a6fa5);

  justify-content: center;
  color: white;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .pagevault-progress { background: #2a2a3a; }
}
